<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Amigo | Splitix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ... mantém o CSS que já tens ... */
        :root {
            --primary: #2e7d32;
            --primary-light: #66bb6a;
            --background: #f6fef6;
            --text: #2f4f2f;
            --white: #ffffff;
            --border: #c8e6c9;
            --radius: 12px;
            --danger: #d32f2f;
            --danger-bg: #fdecea;
        }
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }
        .container {
            max-width: 640px;
            margin: auto;
            background-color: var(--white);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 0.3rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(102, 187, 106, 0.2);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 1.6rem;
            font-size: 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: var(--primary-light);
        }
        .success, .error {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
        }
        .success {
            background-color: #e8f5e9;
            color: #1b5e20;
            border-left: 5px solid var(--primary);
        }
        .error {
            background-color: var(--danger-bg);
            color: var(--danger);
            border-left: 5px solid var(--danger);
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-button:hover {
            color: var(--primary-light);
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a th:href="@{/dashboard}" class="back-button">← Voltar à Dashboard</a>

    <h2>Adicionar Amigo</h2>

    <div th:if="${success}" class="success" th:text="${success}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" th:action="@{/add-friend}">
    <label for="friendEmail">Email do Amigo:</label>
        <input type="email" id="friendEmail" name="friendEmail" required />

        <button type="submit">Adicionar</button>
    </form>
</div>
</body>
</html>
