<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Splitix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2a6f4a;
            --primary-light: #4caf50;
            --bg-light: #f5f9f7;
            --text-dark: #2a2a2a;
            --error-bg: #ffefef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #fff;
            padding: 45px 50px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            text-align: center;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 26px;
            color: var(--primary);
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cce3d8;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 18px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.2);
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s;
        }

        button:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
        }

        .error-message {
            background-color: var(--error-bg);
            color: #b00020;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #4a7c4a;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--primary-light);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>Entrar na Splitix</h1>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input id="email" type="text" name="email" placeholder="exemplo@dominio.com" required autofocus />

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required />

        <button type="submit">Entrar</button>
    </form>

    <div class="footer">
        <p>Esqueceu a password? <a href="/reset-password">Recuperar aqui</a></p>
        <p>Não tem conta? <a href="/register">Registe-se</a></p>
    </div>
</div>
</body>
</html>
