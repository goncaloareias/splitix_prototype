<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Grupos | Splitix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f9f4;
            color: #2e7d32;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 720px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
        }
        h2 {
            font-weight: 600;
            margin-bottom: 20px;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2e7d32;
            font-weight: 600;
        }
        .back-button:hover {
            color: #66bb6a;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            background-color: #e8f5e9;
        }
        a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            color: #66bb6a;
        }
        .error, .success {
            margin-bottom: 16px;
            font-weight: 600;
        }
        .error {
            color: #d32f2f;
        }
        .success {
            color: #2e7d32;
        }
    </style>
</head>
<body>
<div class="container">

    <a th:href="@{/dashboard}" class="back-button">← Voltar à Dashboard</a>

    <h2>Os teus Grupos</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <ul>
        <li th:each="group : ${groups}">
            <a th:href="@{'/group/' + ${group.id}}" th:text="${group.name}">Nome do Grupo</a>
        </li>
    </ul>

    <a th:href="@{/group-create}">+ Criar novo grupo</a>

</div>
</body>
</html>
