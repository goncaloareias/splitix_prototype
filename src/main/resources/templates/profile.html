<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Perfil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fff0;
            color: #2f4f2f;
            margin: 2em;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 0.5em;
            margin-top: 0.5em;
            margin-bottom: 1em;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 0.7em 1.5em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>O Meu Perfil</h2>

    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form method="post" th:object="${user}">
        <label for="fname">Nome:</label>
        <input type="text" id="fname" name="fname" th:value="*{fname}" required>

        <label for="lname">Apelido:</label>
        <input type="text" id="lname" name="lname" th:value="*{lname}" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" th:value="*{email}" required>

        <label>Saldo:</label>
        <input type="text" th:value="*{balance}" readonly>

        <button type="submit">Guardar Alterações</button>
    </form>
</div>
</body>
</html>
