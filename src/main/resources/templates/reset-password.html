<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f9f7;
            color: #2a6f4a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(42,111,74,0.15);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1.8px solid #2a6f4a;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
        }
        .btn {
            background-color: #2a6f4a;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #4caf50;
        }
        .error {
            background-color: #ffcccc;
            color: #a00;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
        }
        .login-link {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .login-link a {
            color: #2a6f4a;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
            color: #4caf50;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Reset Password</h1>

    <!-- Mensagem de erro -->
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" action="/reset-password">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Nova Password</label>
        <input type="password" id="password" name="password" required />

        <label for="confirmPassword">Confirmar Nova Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />

        <button type="submit" class="btn">Alterar Password</button>
    </form>

    <div class="login-link">
        Já tem conta? <a href="/login">Iniciar sessão</a>
    </div>
</div>
</body>
</html>
