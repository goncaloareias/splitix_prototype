<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Criar Grupo | Splitix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #388e3c;
        }

        .back-link {
            text-decoration: none;
            color: #2e7d32;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #66bb6a;
        }

        .error {
            color: #d32f2f;
            margin-top: 10px;
        }

        .success {
            color: #2e7d32;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">

    <a th:href="@{/dashboard}" class="back-link">← Voltar à Dashboard</a>

    <h2>Criar Novo Grupo</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/group-create}" method="post">
        <label for="name">Nome do Grupo:</label>
        <input type="text" id="name" name="name" required />

        <label for="memberEmails">Emails dos Membros (separados por vírgulas):</label>
        <textarea id="memberEmails" name="memberEmails" rows="4" placeholder="exemplo1@email.com, exemplo2@email.com"></textarea>

        <button type="submit">Criar Grupo</button>
    </form>

</div>
</body>
</html>
