<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Notificações | Splitix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --primary: #2e7d32;
            --danger: #d32f2f;
            --white: #fff;
            --background: #f6fef6;
            --border: #c8e6c9;
            --radius: 12px;
            --text: #2f4f2f;
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .container {
            max-width: 640px;
            margin: auto;
            background-color: var(--white);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-button:hover {
            color: #66bb6a;
        }

        ul.notifications-list {
            list-style: none;
            padding: 0;
        }

        ul.notifications-list li {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1rem;
            background-color: #f1f8e9;
            color: var(--text);
            box-shadow: inset 0 0 5px rgba(46, 125, 50, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ul.notifications-list li strong {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .btn-group button {
            background-color: var(--primary);
            border: none;
            color: white;
            padding: 6px 12px;
            margin-left: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-group button.reject {
            background-color: var(--danger);
        }

        .btn-group button:hover {
            filter: brightness(0.9);
        }

        /* Contador de notificações no menu (exemplo) */
        .notification-badge {
            position: relative;
            display: inline-block;
        }
        .notification-badge[data-count]:after {
            content: attr(data-count);
            position: absolute;
            top: -8px;
            right: -12px;
            background: var(--danger);
            color: var(--white);
            width: 20px;
            height: 20px;
            font-size: 12px;
            text-align: center;
            border-radius: 50%;
            line-height: 20px;
            font-weight: 700;
            box-shadow: 0 0 1px #fff;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <a th:href="@{/dashboard}" class="back-button">← Voltar à Dashboard</a>

    <h2>Notificações</h2>

    <div th:if="${notifications.isEmpty()}">
        <p>Não tens novas notificações.</p>
    </div>

    <ul class="notifications-list" th:unless="${notifications.isEmpty()}">
        <li th:each="n : ${notifications}">
            <div>
                <strong th:text="${n.type}">TIPO</strong>:
                <span th:text="${n.message}">Mensagem da notificação</span>
            </div>

            <div th:if="${n.type.name() == 'FRIEND_REQUEST'}" class="btn-group">
                <form th:action="@{'/notifications/requests/' + ${n.id} + '/accept'}" method="post" style="display:inline">
                    <button type="submit">Aceitar</button>
                </form>
                <form th:action="@{'/notifications/requests/' + ${n.id} + '/reject'}" method="post" style="display:inline">
                    <button type="submit" class="reject">Rejeitar</button>
                </form>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
